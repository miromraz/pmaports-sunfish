# Sunfish: defer the touch + haptics drivers past the boot coldplug.
# stmfts/drv2624 probing during the boot coldplug intermittently hangs a
# cold chip (boot loop). Blacklisting them here keeps them off the udev
# coldplug path; /etc/local.d/sunfish-modules.start loads them just after
# boot, where the probe is reliable. blacklist only blocks udev alias
# auto-load -- an explicit "modprobe <name>" still works.
blacklist stmfts
blacklist drv2624
